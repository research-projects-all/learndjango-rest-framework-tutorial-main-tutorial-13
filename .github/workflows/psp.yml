name: Semgrep Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --sarif \
            --output psp-results.sarif \
            --exclude .venv \
            --exclude venv \
            --exclude __pycache__ \
            .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('psp-results.sarif') != ''
        with:
          sarif_file: psp-results.sarif
