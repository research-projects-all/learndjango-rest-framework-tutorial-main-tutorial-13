name: PSP Pedagogical Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  psp:
    name: Run Pedagogical SAST Profile
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | sort

      - name: Pedagogical SAST Profile PSP
        uses: research-projects-all/Pedagogical-SAST-Profile-PSP@v2.0.0
        with:
          framework: python
          scan-path: .
          output-format: sarif
          output-file: psp-results.sarif
          fail-on-finding: false
